<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwissMaster - Chess Tournament Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SwissMaster</h1>
        <div class="nav-links">
            <button class="nav-btn" data-target="nav-setup">
                Setup
            </button>
            <button class="nav-btn" data-target="nav-pairings">
                Pairings
            </button>
            <button class="nav-btn" data-target="nav-results">
                Results
            </button>
        </div>
    </header>

    <div id="app">
        <main>
            <!-- Setup -->
            <section id="setup" class="view active">
                <div class="setup-steps">
                    <div class="setup-step active" id="step-indicator-1">
                        <span>1</span>
                        <p>Tournament settings</p>
                    </div>
                    <div class="setup-step" id="step-indicator-2">
                        <span>2</span>
                        <p>Participants/Teams</p>
                    </div>
                </div>
                <div id="setup-step-1" class="setup-page active">
                    <div class="setup-grid">
                        <div class="card setup-card">

                            <h2>Tournament settings</h2>

                            <div class="settings-grid">
                                <div class="section-title">General</div>

                                <div class="form-group full-width">
                                    <label for="tournament-name">Tournament Name</label>
                                    <input type="text" id="tournament-name" placeholder="Tournament name">
                                </div>

                                <div class="form-group full-width">
                                    <label>Tournament Mode</label>
                                    <div class="option-group" role="radiogroup">
                                        <label class="option-pill">
                                            <input type="radio" name="tournament-mode" value="TEAM" checked>
                                            <span>Team Tournament</span>
                                        </label>
                                        <label class="option-pill">
                                            <input type="radio" name="tournament-mode" value="SINGLES">
                                            <span>Single Tournament</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="section-title">Format</div>

                                <div class="form-group">
                                    <label for="pairing-system">System</label>
                                    <select id="pairing-system">
                                        <option value="SWISS">Swiss System</option>
                                        <option value="ROUND_ROBIN">Round Robbin</option>
                                        <!-- Add more Systems-->
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Number of Boards</label>
                                    <input type="number" id="boards-count" min="1">
                                </div>

                                <div class="form-group">
                                    <label>Number of Rounds</label>
                                    <input type="number" id="total-rounds" min="1">
                                </div>

                                <div class="section-title">Rules</div>

                                <div class="form-group full-width">
                                    <select id="rules-preset">
                                        <!--Add rule format (FIDE and stuff)-->
                                    </select>
                                </div>     
                                <!-- Maybe custom amount of points for win and loss-->
                            </div>
                        </div>
                    </div>
                    <div class="setup-navigation">
                        <button type="button" id="next-to-participants">
                            Next: Participants →
                        </button>
                    </div>
                </div>
                    <!-- Step 2 -->
                <div id="setup-step-2" class="setup-page">

                    <div class="card setup-card">
                        <h2>Add participants</h2>

                        <!-- Participants -->

                        <div class="setup-navigation">
                            <button type="button" id="back-to-settings">
                                ← Back
                            </button>

                            <button type="button" id="finish-setup">
                                Finish Setup
                            </button>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
